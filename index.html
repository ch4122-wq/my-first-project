<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Welcome to My First Project.">
  <title>My First Project</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, sans-serif; color: #172033; background: #f4f6fb; }
    main { width: 100%; max-width: 640px; padding: clamp(28px, 6vw, 64px); border: 1px solid #e1e6ef; border-radius: 24px; background: white; }
    .label { color: #4659b8; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 16px 0; font-size: clamp(32px, 7vw, 48px); line-height: 1.1; letter-spacing: -.04em; }
    p { color: #566174; font-size: 18px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <span class="label">Welcome</span>
    <h1>My First Project</h1>
    <p>A new beginning. More coming soon.</p>
  </main>
</body>
</html>
